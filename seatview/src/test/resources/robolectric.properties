# Single source of truth for the Robolectric SDK levels used by every unit test in this
# module, instead of repeating @Config(sdk = [..]) on each test class.
#
# Every test runs once per SDK listed here, so a behavior that only breaks on one platform
# version is caught. SDK 36+ requires the tests to run on Java 21, which is configured in
# build.gradle.kts (a Test-task-only launcher) while the library itself stays on Java 17.
sdk=34,35,36,37
